<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP点检助手</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">MCP点检助手<span class="sub" data-i18n="brand_sub">mcppreflight</span></div>

    <section>
      <h3 data-i18n="sec_model">模型设置</h3>
      <label data-i18n="lbl_provider">服务商</label>
      <select id="cfg-provider" spellcheck="false"></select>
      <label data-i18n="lbl_base">API 地址</label>
      <input id="cfg-base" type="text" placeholder="https://api.deepseek.com" spellcheck="false">
      <label data-i18n="lbl_key">API Key</label>
      <input id="cfg-key" type="password" placeholder="sk-..." spellcheck="false">
      <label data-i18n="lbl_model">模型</label>
      <div class="row">
        <input id="cfg-model" type="text" list="model-list" placeholder="deepseek-flash" spellcheck="false">
        <button id="btn-models" class="mini" data-i18n="btn_fetch_short" data-i18n-title="btn_fetch" title="从 API 获取可用模型列表">获取</button>
      </div>
      <datalist id="model-list"></datalist>
      <div id="provider-note" class="hint"></div>
      <div class="row">
        <button id="btn-save-cfg" class="primary block" data-i18n="btn_save">保存配置</button>
      </div>
      <div id="cfg-msg" class="hint"></div>
    </section>

    <section>
      <h3 data-i18n="sec_workspace">工作区</h3>
      <div class="row">
        <button id="btn-pick" class="block" data-i18n="btn_pick">选择工作区文件夹</button>
      </div>
      <div id="ws-path" class="hint">未选择</div>
    </section>

    <section>
      <h3 data-i18n="sec_mcp">MCP 服务器</h3>
      <label data-i18n="lbl_mcp_path">mcp.json 路径</label>
      <div class="row">
        <input id="cfg-mcp" type="text" spellcheck="false">
        <button id="btn-reload" class="mini" data-i18n-title="btn_reload_title" data-i18n="btn_load" title="重新读取 mcp.json 并连接">加载</button>
      </div>
      <div id="server-list"></div>
    </section>

    <section>
      <h3 data-i18n="sec_appearance">外观</h3>
      <label data-i18n="lbl_lang">语言</label>
      <select id="cfg-lang">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
      <label data-i18n="lbl_theme">主题</label>
      <select id="cfg-theme">
        <option value="light" data-i18n="theme_light">浅色</option>
        <option value="dark" data-i18n="theme_dark">暗色</option>
      </select>
    </section>

    <section>
      <button id="btn-reset" class="block" data-i18n="btn_new_session">新会话</button>
    </section>
  </aside>

  <main id="main">
    <div id="chat"></div>
    <div id="composer">
      <textarea id="input" rows="3" data-i18n-ph="composer_ph" placeholder="输入点检指令，例如：请对当前工作区执行点检并输出报告（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="btn-send" class="primary" data-i18n="btn_send">发送</button>
    </div>
  </main>

  <div id="panel-resizer" data-i18n-title="resizer_title" title="拖动调整右侧面板宽度（双击恢复默认）"></div>

  <aside id="mcp-panel">
    <div class="panel-head">
      <span class="panel-title" data-i18n="panel_title">MCP 工具调用</span>
      <button id="btn-clear-tools" class="mini" data-i18n="btn_clear" data-i18n-title="btn_clear_title" title="清空右侧调用记录">清空</button>
    </div>
    <div id="mcp-log">
      <div id="mcp-empty" class="empty" data-i18n="mcp_empty">尚无工具调用</div>
    </div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
